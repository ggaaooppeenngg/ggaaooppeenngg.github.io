<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" font-family="'Times New Roman', 'STIX Two Text', serif">
  <title>Chunkwise 线性注意力:O_c = Q_c S_c^prev + tril(Q_c K_c^T) V_c</title>
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#1a1a1a" stroke-width="1.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="720" fill="#ffffff"/>

  <!-- ================= 顶部:前序 chunk 的注意力 ================= -->
  <text x="300" y="42" text-anchor="middle" font-family="'SimSun','Songti SC','Noto Serif CJK SC',serif" font-size="16" fill="#111">前序 chunk 的注意力</text>
  <g>
    <rect x="210" y="64" width="180" height="180" fill="#ffffff"/>
    <path d="M210,64 L390,64 L390,244 Z" fill="#ebebeb"/>
    <path d="M210,64 L390,244 L210,244 Z" fill="url(#hatch)"/>
    <line x1="210" y1="64" x2="390" y2="244" stroke="#111" stroke-width="1.5"/>
    <rect x="210" y="64" width="180" height="180" fill="none" stroke="#111" stroke-width="1.5"/>
  </g>
  <text x="402" y="159" font-size="13.5" font-style="italic" fill="#777">chunk c−1</text>

  <!-- 汇总为递归状态的箭头 -->
  <line x1="300" y1="250" x2="300" y2="344" stroke="#111" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="316" y="302" font-family="'SimSun','Songti SC','Noto Serif CJK SC',serif" font-size="14" fill="#333">汇总为递归状态 <tspan font-style="italic" font-size="15">S</tspan><tspan dy="5" font-size="11.5" font-style="italic">c</tspan><tspan dy="-11" font-size="11.5" font-style="italic">prev</tspan></text>

  <!-- ================= 底部:两项分解 ================= -->
  <!-- 花括号 B_c -->
  <path d="M205,354 C197,354 196,358 196,366 L196,430 C196,439 193,444 185,444 C193,444 196,449 196,458 L196,522 C196,530 197,534 205,534" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="166" y="451" text-anchor="middle" font-size="19" font-style="italic" fill="#111">B<tspan dy="5" font-size="13">c</tspan></text>

  <!-- 左项:Q_c · S_c^prev(全阴影) -->
  <g>
    <rect x="210" y="354" width="180" height="180" fill="url(#hatch)"/>
    <rect x="210" y="354" width="180" height="180" fill="none" stroke="#111" stroke-width="1.5"/>
  </g>

  <!-- 加号 -->
  <text x="420" y="456" text-anchor="middle" font-size="36" fill="#111">+</text>

  <!-- 右项:tril(Q_c K_c^T) · V_c(下三角阴影) -->
  <g>
    <rect x="450" y="354" width="180" height="180" fill="#ffffff"/>
    <path d="M450,354 L630,354 L630,534 Z" fill="#ebebeb"/>
    <path d="M450,354 L630,534 L450,534 Z" fill="url(#hatch)"/>
    <line x1="450" y1="354" x2="630" y2="534" stroke="#111" stroke-width="1.5"/>
    <rect x="450" y="354" width="180" height="180" fill="none" stroke="#111" stroke-width="1.5"/>
  </g>
  <text x="644" y="449" font-size="13.5" font-style="italic" fill="#777">chunk c</text>

  <!-- 项标签 -->
  <text x="300" y="574" text-anchor="middle" font-size="20" fill="#111"><tspan font-style="italic">Q</tspan><tspan dy="5" font-size="14" font-style="italic">c</tspan><tspan dy="-5" font-size="20"> · </tspan><tspan font-style="italic">S</tspan><tspan dy="5" font-size="14" font-style="italic">c</tspan><tspan dy="-11" font-size="14" font-style="italic">prev</tspan></text>
  <text x="300" y="600" text-anchor="middle" font-family="'SimSun','Songti SC','Noto Serif CJK SC',serif" font-size="13" fill="#666">跨块贡献(来自历史状态)</text>

  <text x="540" y="574" text-anchor="middle" font-size="20" fill="#111"><tspan>tril(</tspan><tspan font-style="italic">Q</tspan><tspan dy="5" font-size="14" font-style="italic">c</tspan><tspan dy="-5" font-size="20"> </tspan><tspan font-style="italic">K</tspan><tspan dy="5" font-size="14" font-style="italic">c</tspan><tspan dy="-14" font-size="14">⊤</tspan><tspan dy="9" font-size="20">) · </tspan><tspan font-style="italic">V</tspan><tspan dy="5" font-size="14" font-style="italic">c</tspan></text>
  <text x="540" y="600" text-anchor="middle" font-family="'SimSun','Songti SC','Noto Serif CJK SC',serif" font-size="13" fill="#666">块内贡献(chunk 内因果注意力)</text>

  <!-- ================= 总公式 ================= -->
  <text x="420" y="666" text-anchor="middle" font-size="23" fill="#111"><tspan font-style="italic">O</tspan><tspan dy="6" font-size="15" font-style="italic">c</tspan><tspan dy="-6" font-size="23"> = </tspan><tspan font-style="italic">Q</tspan><tspan dy="6" font-size="15" font-style="italic">c</tspan><tspan dy="-6" font-size="23"> </tspan><tspan font-style="italic">S</tspan><tspan dy="6" font-size="15" font-style="italic">c</tspan><tspan dy="-12" font-size="15" font-style="italic">prev</tspan><tspan dy="6" font-size="23"> + tril(</tspan><tspan font-style="italic">Q</tspan><tspan dy="6" font-size="15" font-style="italic">c</tspan><tspan dy="-6" font-size="23"> </tspan><tspan font-style="italic">K</tspan><tspan dy="6" font-size="15" font-style="italic">c</tspan><tspan dy="-15" font-size="15">⊤</tspan><tspan dy="9" font-size="23">) </tspan><tspan font-style="italic">V</tspan><tspan dy="6" font-size="15" font-style="italic">c</tspan></text>
</svg>
