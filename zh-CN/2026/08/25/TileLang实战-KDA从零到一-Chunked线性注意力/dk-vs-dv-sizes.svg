<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1730" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#374151"/></marker>
    <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#0f766e"/></marker>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#b45309"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#dc2626"/></marker>
  </defs>

  <rect x="0" y="0" width="800" height="1730" fill="#ffffff"/>

  <!-- ======== 标题与全局尺寸 ======== -->
  <text x="40" y="44" font-size="18" font-weight="bold" fill="#111827">最原始的线性注意力(无门控、无擦除):S ← S + Kᵀ·V ,o_t = S_t·q_t</text>
  <rect x="140" y="80" width="64" height="40" fill="#f3f4f6" stroke="#374151" stroke-width="1.3"/>
  <text x="172" y="97" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">K</text>
  <text x="172" y="113" font-size="9.5" fill="#6b7280" text-anchor="middle">N×DK</text>
  <rect x="234" y="80" width="64" height="40" fill="#f3f4f6" stroke="#374151" stroke-width="1.3"/>
  <text x="266" y="97" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">V</text>
  <text x="266" y="113" font-size="9.5" fill="#6b7280" text-anchor="middle">N×DV</text>
  <line x1="300" y1="100" x2="340" y2="100" stroke="#374151" stroke-width="1.5" marker-end="url(#ad)"/>
  <text x="320" y="66" font-size="10.5" fill="#2563eb" text-anchor="middle">Kᵀ·V 收缩 N(蓝)</text>
  <rect x="344" y="80" width="64" height="40" fill="#fafafa" stroke="#111827" stroke-width="1.6"/>
  <text x="376" y="97" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">S</text>
  <text x="376" y="113" font-size="9.5" fill="#6b7280" text-anchor="middle">DK×DV</text>
  <rect x="470" y="80" width="64" height="40" fill="#f3f4f6" stroke="#374151" stroke-width="1.3"/>
  <text x="502" y="97" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">Q</text>
  <text x="502" y="113" font-size="9.5" fill="#6b7280" text-anchor="middle">N×DK</text>
  <text x="549" y="106" font-size="14" fill="#374151" text-anchor="middle">×</text>
  <rect x="570" y="80" width="64" height="40" fill="#fafafa" stroke="#111827" stroke-width="1.6"/>
  <text x="602" y="97" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">S</text>
  <text x="602" y="113" font-size="9.5" fill="#6b7280" text-anchor="middle">DK×DV</text>
  <text x="649" y="106" font-size="14" fill="#374151" text-anchor="middle">=</text>
  <rect x="665" y="80" width="64" height="40" fill="#fafafa" stroke="#111827" stroke-width="1.6"/>
  <text x="697" y="97" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">O</text>
  <text x="697" y="113" font-size="9.5" fill="#6b7280" text-anchor="middle">N×DV</text>
  <text x="649" y="66" font-size="10.5" fill="#dc2626" text-anchor="middle">收缩 DK(红)</text>
  <text x="140" y="142" font-size="12" fill="#374151">灰框 = 全量矩阵;彩条 = 一个 block 分到的条带;蓝 = token 求和轴;红 = DK 收缩(吸收维)</text>
  <text x="140" y="164" font-size="12" fill="#6b7280">↓ 按顺序阅读:① 切 DV → ② 切 DK</text>

  <!-- ======== 面板 ①:K 全量 × Vⁱ(切 DV) ======== -->
  <rect x="30" y="190" width="730" height="690" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="50" y="222" font-size="18" font-weight="bold" fill="#0f766e">第一种:K 全量 × Vⁱ(切 DV)</text>
  <text x="50" y="246" font-size="12.5" fill="#475569">每个 block:整根 K 配一根 V 列条带;输出直接就是答案的条带</text>

  <rect x="55" y="310" width="100" height="100" fill="#e5e7eb" stroke="#374151" stroke-width="1.6"/>
  <text x="105" y="362" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">K</text>
  <text x="105" y="428" font-size="10" fill="#6b7280" text-anchor="middle">N×DK(全量)</text>
  <text x="185" y="366" font-size="16" fill="#374151" text-anchor="middle">×</text>
  <rect x="215" y="310" width="25" height="100" fill="#99f6e4" stroke="#0f766e" stroke-width="1.3"/>
  <text x="227" y="302" font-size="11" font-weight="bold" fill="#0f766e" text-anchor="middle">V⁰</text>
  <text x="227" y="428" font-size="10" fill="#6b7280" text-anchor="middle">N×DV/4</text>
  <line x1="242" y1="360" x2="300" y2="360" stroke="#0f766e" stroke-width="1.6" marker-end="url(#at)"/>
  <text x="271" y="346" font-size="10.5" fill="#2563eb" text-anchor="middle">收缩 N</text>
  <rect x="305" y="310" width="25" height="100" fill="#5eead4" stroke="#0f766e" stroke-width="1.3"/>
  <text x="317" y="302" font-size="11" font-weight="bold" fill="#0f766e" text-anchor="middle">S⁰</text>
  <text x="317" y="428" font-size="10" fill="#6b7280" text-anchor="middle">DK×DV/4</text>

  <rect x="55" y="490" width="100" height="100" fill="#e5e7eb" stroke="#374151" stroke-width="1.6"/>
  <text x="105" y="542" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">Q</text>
  <text x="105" y="608" font-size="10" fill="#6b7280" text-anchor="middle">N×DK(全量)</text>
  <text x="185" y="546" font-size="16" fill="#374151" text-anchor="middle">×</text>
  <rect x="215" y="490" width="25" height="100" fill="#5eead4" stroke="#0f766e" stroke-width="1.3"/>
  <text x="227" y="482" font-size="11" font-weight="bold" fill="#0f766e" text-anchor="middle">S⁰</text>
  <text x="227" y="608" font-size="10" fill="#6b7280" text-anchor="middle">DK×DV/4</text>
  <line x1="242" y1="540" x2="300" y2="540" stroke="#0f766e" stroke-width="1.6" marker-end="url(#at)"/>
  <text x="271" y="526" font-size="10.5" fill="#dc2626" text-anchor="middle">收缩 DK</text>
  <rect x="305" y="490" width="25" height="100" fill="#2dd4bf" stroke="#0f766e" stroke-width="1.6"/>
  <text x="317" y="482" font-size="11" font-weight="bold" fill="#0f766e" text-anchor="middle">o⁰</text>
  <text x="317" y="608" font-size="10" fill="#6b7280" text-anchor="middle">N×DV/4</text>
  <text x="317" y="628" font-size="10.5" fill="#16a34a" text-anchor="middle">最终答案的条带 ✓</text>

  <text x="514" y="302" font-size="11.5" font-weight="bold" fill="#0f766e" text-anchor="middle">S = 四条带直接拼接(DK×DV)</text>
  <rect x="460" y="310" width="27" height="100" fill="#99f6e4" stroke="#0f766e" stroke-width="1"/>
  <rect x="487" y="310" width="27" height="100" fill="#5eead4" stroke="#0f766e" stroke-width="1"/>
  <rect x="514" y="310" width="27" height="100" fill="#2dd4bf" stroke="#0f766e" stroke-width="1"/>
  <rect x="541" y="310" width="27" height="100" fill="#14b8a6" stroke="#0f766e" stroke-width="1"/>
  <text x="514" y="482" font-size="11.5" font-weight="bold" fill="#0f766e" text-anchor="middle">O = 四条带直接拼接(N×DV)</text>
  <rect x="460" y="490" width="27" height="100" fill="#99f6e4" stroke="#0f766e" stroke-width="1"/>
  <rect x="487" y="490" width="27" height="100" fill="#5eead4" stroke="#0f766e" stroke-width="1"/>
  <rect x="514" y="490" width="27" height="100" fill="#2dd4bf" stroke="#0f766e" stroke-width="1"/>
  <rect x="541" y="490" width="27" height="100" fill="#14b8a6" stroke="#0f766e" stroke-width="1"/>
  <text x="600" y="640" font-size="11.5" fill="#16a34a" text-anchor="middle">拼接 ≠ 相加:条带互不重叠,各写各的 ✓</text>

  <rect x="55" y="760" width="680" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="395" y="786" font-size="14" font-weight="bold" fill="#166534" text-anchor="middle">第一种:每个 block 产出的就是最终矩阵的条带</text>
  <text x="395" y="808" font-size="12" fill="#166534" text-anchor="middle">更新、输出两步都只有「拼接」,零累加、零跨块通信</text>

  <!-- ======== 面板 ②:Kⁱ × V 全量(切 DK) ======== -->
  <rect x="30" y="910" width="730" height="690" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="50" y="942" font-size="18" font-weight="bold" fill="#b45309">第二种:Kⁱ × V 全量(切 DK)</text>
  <text x="50" y="966" font-size="12.5" fill="#57534e">状态更新没有累加;但和 Q 相乘时,收缩轴 DK 不在块内 → 部分和,必须累加</text>

  <rect x="85" y="1030" width="25" height="100" fill="#fde68a" stroke="#b45309" stroke-width="1.3"/>
  <text x="97" y="1022" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">K⁰</text>
  <text x="97" y="1148" font-size="10" fill="#6b7280" text-anchor="middle">N×DK/4</text>
  <text x="138" y="1086" font-size="16" fill="#374151" text-anchor="middle">×</text>
  <rect x="165" y="1030" width="100" height="100" fill="#e5e7eb" stroke="#374151" stroke-width="1.6"/>
  <text x="215" y="1082" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">V</text>
  <text x="215" y="1148" font-size="10" fill="#6b7280" text-anchor="middle">N×DV(全量)</text>
  <line x1="267" y1="1080" x2="322" y2="1080" stroke="#b45309" stroke-width="1.6" marker-end="url(#aa)"/>
  <text x="294" y="1066" font-size="10.5" fill="#2563eb" text-anchor="middle">收缩 N</text>
  <rect x="327" y="1082" width="100" height="25" fill="#fcd34d" stroke="#b45309" stroke-width="1.3"/>
  <text x="377" y="1074" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">S⁰ = K⁰ᵀ·V</text>
  <text x="377" y="1124" font-size="10" fill="#6b7280" text-anchor="middle">DK/4×DV</text>
  <text x="377" y="1170" font-size="11.5" fill="#16a34a" text-anchor="middle">状态:行条带互不重叠 —— 各加各的,无累加 ✓</text>

  <rect x="85" y="1210" width="25" height="100" fill="#fde68a" stroke="#b45309" stroke-width="1.3"/>
  <text x="97" y="1202" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">Q⁰</text>
  <text x="97" y="1328" font-size="10" fill="#6b7280" text-anchor="middle">N×DK/4</text>
  <text x="97" y="1345" font-size="10.5" fill="#dc2626" text-anchor="middle">Q 也要切!</text>
  <text x="138" y="1266" font-size="16" fill="#374151" text-anchor="middle">×</text>
  <rect x="165" y="1262" width="100" height="25" fill="#fcd34d" stroke="#b45309" stroke-width="1.3"/>
  <text x="215" y="1280" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">S⁰</text>
  <text x="215" y="1305" font-size="10" fill="#6b7280" text-anchor="middle">DK/4×DV</text>
  <line x1="267" y1="1274" x2="322" y2="1274" stroke="#b45309" stroke-width="1.6" marker-end="url(#aa)"/>
  <text x="294" y="1259" font-size="10.5" fill="#dc2626" text-anchor="middle">收缩 DK</text>
  <rect x="327" y="1210" width="100" height="100" fill="#fffbeb" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="377" y="1257" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">õ⁰ = Q⁰·S⁰</text>
  <text x="377" y="1277" font-size="10" fill="#92400e" text-anchor="middle">= N×DV 全宽</text>
  <text x="377" y="1328" font-size="10.5" fill="#dc2626" text-anchor="middle">部分和!</text>

  <text x="305" y="1385" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">四份 õⁱ 都是 N×DV 全宽 —— 必须累加(规约)</text>
  <rect x="130" y="1400" width="100" height="28" fill="#fffbeb" stroke="#b45309" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="180" y="1419" font-size="11" fill="#92400e" text-anchor="middle">õ⁰ (N×DV)</text>
  <text x="180" y="1446" font-size="14" fill="#dc2626" text-anchor="middle">+</text>
  <rect x="130" y="1452" width="100" height="28" fill="#fffbeb" stroke="#b45309" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="180" y="1471" font-size="11" fill="#92400e" text-anchor="middle">õ¹ (N×DV)</text>
  <text x="180" y="1498" font-size="14" fill="#dc2626" text-anchor="middle">+</text>
  <rect x="130" y="1504" width="100" height="28" fill="#fffbeb" stroke="#b45309" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="180" y="1523" font-size="11" fill="#92400e" text-anchor="middle">õ² (N×DV)</text>
  <text x="180" y="1550" font-size="14" fill="#dc2626" text-anchor="middle">+</text>
  <rect x="130" y="1556" width="100" height="28" fill="#fffbeb" stroke="#b45309" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="180" y="1575" font-size="11" fill="#92400e" text-anchor="middle">õ³ (N×DV)</text>

  <line x1="234" y1="1490" x2="276" y2="1490" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar)"/>
  <circle cx="308" cy="1490" r="22" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="308" y="1500" font-size="26" font-weight="bold" fill="#dc2626" text-anchor="middle">+</text>
  <line x1="332" y1="1490" x2="370" y2="1490" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="374" y="1468" width="140" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="444" y="1487" font-size="12.5" font-weight="bold" fill="#991b1b" text-anchor="middle">o = Σ õⁱ</text>
  <text x="444" y="1505" font-size="10" fill="#991b1b" text-anchor="middle">N×DV</text>
  <text x="308" y="1592" font-size="11" fill="#6b7280" text-anchor="middle">õ⁰~õ³ 覆盖同一块 O 区域:各含 1/4 根收缩轴的贡献,少加任何一份结果就错</text>

  <!-- ======== 底部结论 ======== -->
  <text x="40" y="1630" font-size="13.5" font-weight="bold" fill="#111827">尺寸视角的一句话:第一种 oⁱ 是 N×DV/4 的「答案条带」,拼起来就是 O;</text>
  <text x="40" y="1656" font-size="13.5" font-weight="bold" fill="#111827">第二种 õⁱ 是 N×DV 的「部分和」,必须在 DK 上把 4 份加完才是 O。</text>
  <text x="40" y="1684" font-size="11.5" fill="#6b7280">(N 为 token 数;按块长 C 分块时把 N 读作 C,关系不变。</text>
  <text x="40" y="1706" font-size="11.5" fill="#6b7280">第二种里 Q 也不得不跟着切成 N×DK/4 —— 这正是「切吸收维,处处被动」的尺寸体现。)</text>
</svg>
