<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1070" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="800" height="1070" fill="#ffffff"/>

  <!-- ======== 标题与公式 ======== -->
  <text x="40" y="42" font-size="19" font-weight="bold" fill="#111827">GDN 块内衰减矩阵 Γ:下三角,权重只由 token 序号差决定</text>
  <rect x="40" y="58" width="720" height="66" rx="8" fill="#fafafa" stroke="#d1d5db"/>
  <text x="58" y="84" font-size="14" fill="#111827">Γ[i,j] = γⁱ ÷ γʲ ,其中 γⁱ = α₁α₂⋯αᵢ(chunk 内前 i 个门控的累积积)</text>
  <text x="58" y="110" font-size="14" font-weight="bold" fill="#111827">= αⁱ⁻ʲ   若 j ≤ i        = 0   若 j &gt; i</text>

  <!-- ======== 面板 ①:结构 ======== -->
  <rect x="30" y="148" width="730" height="408" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="50" y="180" font-size="17" font-weight="bold" fill="#0f766e">① 结构:C×C 下三角,每个值只由序号差 i − j 决定</text>

  <text x="141" y="212" font-size="11" fill="#6b7280" text-anchor="middle">j=1</text>
  <text x="203" y="212" font-size="11" fill="#6b7280" text-anchor="middle">j=2</text>
  <text x="265" y="212" font-size="11" fill="#6b7280" text-anchor="middle">j=3</text>
  <text x="327" y="212" font-size="11" fill="#6b7280" text-anchor="middle">j=4</text>
  <text x="389" y="212" font-size="11" fill="#6b7280" text-anchor="middle">j=5</text>
  <text x="100" y="259" font-size="11" fill="#6b7280" text-anchor="end">i=1</text>
  <text x="100" y="321" font-size="11" fill="#6b7280" text-anchor="end">i=2</text>
  <text x="100" y="383" font-size="11" fill="#6b7280" text-anchor="end">i=3</text>
  <text x="100" y="445" font-size="11" fill="#6b7280" text-anchor="end">i=4</text>
  <text x="100" y="507" font-size="11" fill="#6b7280" text-anchor="end">i=5</text>

  <!-- 行1 -->
  <rect x="110" y="222" width="62" height="62" fill="#14b8a6"/><text x="141" y="259" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">α⁰</text>
  <rect x="172" y="222" width="62" height="62" fill="#f3f4f6"/><text x="203" y="259" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="234" y="222" width="62" height="62" fill="#f3f4f6"/><text x="265" y="259" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="296" y="222" width="62" height="62" fill="#f3f4f6"/><text x="327" y="259" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="358" y="222" width="62" height="62" fill="#f3f4f6"/><text x="389" y="259" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <!-- 行2 -->
  <rect x="110" y="284" width="62" height="62" fill="#5eead4"/><text x="141" y="321" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α¹</text>
  <rect x="172" y="284" width="62" height="62" fill="#14b8a6"/><text x="203" y="321" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">α⁰</text>
  <rect x="234" y="284" width="62" height="62" fill="#f3f4f6"/><text x="265" y="321" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="296" y="284" width="62" height="62" fill="#f3f4f6"/><text x="327" y="321" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="358" y="284" width="62" height="62" fill="#f3f4f6"/><text x="389" y="321" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <!-- 行3 -->
  <rect x="110" y="346" width="62" height="62" fill="#99f6e4"/><text x="141" y="383" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α²</text>
  <rect x="172" y="346" width="62" height="62" fill="#5eead4"/><text x="203" y="383" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α¹</text>
  <rect x="234" y="346" width="62" height="62" fill="#14b8a6"/><text x="265" y="383" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">α⁰</text>
  <rect x="296" y="346" width="62" height="62" fill="#f3f4f6"/><text x="327" y="383" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="358" y="346" width="62" height="62" fill="#f3f4f6"/><text x="389" y="383" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <!-- 行4 -->
  <rect x="110" y="408" width="62" height="62" fill="#ccfbf1"/><text x="141" y="445" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α³</text>
  <rect x="172" y="408" width="62" height="62" fill="#99f6e4"/><text x="203" y="445" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α²</text>
  <rect x="234" y="408" width="62" height="62" fill="#5eead4"/><text x="265" y="445" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α¹</text>
  <rect x="296" y="408" width="62" height="62" fill="#14b8a6"/><text x="327" y="445" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">α⁰</text>
  <rect x="358" y="408" width="62" height="62" fill="#f3f4f6"/><text x="389" y="445" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <!-- 行5 -->
  <rect x="110" y="470" width="62" height="62" fill="#d5f3ec"/><text x="141" y="507" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α⁴</text>
  <rect x="172" y="470" width="62" height="62" fill="#ccfbf1"/><text x="203" y="507" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α³</text>
  <rect x="234" y="470" width="62" height="62" fill="#99f6e4"/><text x="265" y="507" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α²</text>
  <rect x="296" y="470" width="62" height="62" fill="#5eead4"/><text x="327" y="507" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α¹</text>
  <rect x="358" y="470" width="62" height="62" fill="#14b8a6"/><text x="389" y="507" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">α⁰</text>

  <rect x="450" y="231" width="16" height="16" fill="#14b8a6"/>
  <text x="474" y="244" font-size="12" fill="#134e4a">对角线 α⁰ = 1:自己看自己,零衰减</text>
  <text x="474" y="262" font-size="11" fill="#6b7280">(含对角,与系列 inclusive 约定一致)</text>
  <rect x="450" y="311" width="16" height="16" fill="#99f6e4"/>
  <text x="474" y="324" font-size="12" fill="#134e4a">同一行自右向左:j 离 i 的 token 间隔越大,</text>
  <text x="474" y="342" font-size="12" fill="#134e4a">权重按 αⁱ⁻ʲ 指数缩小</text>
  <rect x="450" y="401" width="16" height="16" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="474" y="414" font-size="12" fill="#374151">上三角 j&gt;i 是还没发生的 token:整块置 0</text>
  <text x="474" y="432" font-size="11" fill="#6b7280">「下三角」的全部含义就在这</text>
  <text x="50" y="546" font-size="11.5" fill="#6b7280">图中 C = 5;实际块长 C = 64 或 128,结构完全相同。颜色越深 = 权重越大 = 两个 token 靠得越近。</text>

  <!-- ======== 面板 ②:数值例 ======== -->
  <rect x="30" y="576" width="730" height="430" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="50" y="608" font-size="17" font-weight="bold" fill="#111827">② 数值例:α = 0.5,C = 4 —— 每格 = 行号 γⁱ ÷ 列号 γʲ</text>

  <text x="247" y="646" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">1</text>
  <text x="321" y="646" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">2</text>
  <text x="395" y="646" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">3</text>
  <text x="469" y="646" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">4</text>
  <text x="198" y="698" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="end">1</text>
  <text x="198" y="772" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="end">2</text>
  <text x="198" y="846" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="end">3</text>
  <text x="198" y="920" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="end">4</text>

  <!-- 行1 -->
  <rect x="210" y="656" width="74" height="74" fill="#14b8a6"/><text x="247" y="686" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="247" y="708" font-size="10" fill="#ccfbf1" text-anchor="middle">α⁰</text>
  <rect x="284" y="656" width="74" height="74" fill="#f3f4f6"/><text x="321" y="696" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="358" y="656" width="74" height="74" fill="#f3f4f6"/><text x="395" y="696" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="432" y="656" width="74" height="74" fill="#f3f4f6"/><text x="469" y="696" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <!-- 行2 -->
  <rect x="210" y="730" width="74" height="74" fill="#5eead4"/><text x="247" y="760" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">0.5</text><text x="247" y="782" font-size="10" fill="#0f766e" text-anchor="middle">α¹</text>
  <rect x="284" y="730" width="74" height="74" fill="#14b8a6"/><text x="321" y="760" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="321" y="782" font-size="10" fill="#ccfbf1" text-anchor="middle">α⁰</text>
  <rect x="358" y="730" width="74" height="74" fill="#f3f4f6"/><text x="395" y="770" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="432" y="730" width="74" height="74" fill="#f3f4f6"/><text x="469" y="770" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <!-- 行3 -->
  <rect x="210" y="804" width="74" height="74" fill="#99f6e4"/><text x="247" y="834" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">0.25</text><text x="247" y="856" font-size="10" fill="#0f766e" text-anchor="middle">α²</text>
  <rect x="284" y="804" width="74" height="74" fill="#5eead4"/><text x="321" y="834" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">0.5</text><text x="321" y="856" font-size="10" fill="#0f766e" text-anchor="middle">α¹</text>
  <rect x="358" y="804" width="74" height="74" fill="#14b8a6"/><text x="395" y="834" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="395" y="856" font-size="10" fill="#ccfbf1" text-anchor="middle">α⁰</text>
  <rect x="432" y="804" width="74" height="74" fill="#f3f4f6"/><text x="469" y="844" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <!-- 行4 -->
  <rect x="210" y="878" width="74" height="74" fill="#ccfbf1"/><text x="247" y="908" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">0.125</text><text x="247" y="930" font-size="10" fill="#0f766e" text-anchor="middle">α³</text>
  <rect x="284" y="878" width="74" height="74" fill="#99f6e4"/><text x="321" y="908" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">0.25</text><text x="321" y="930" font-size="10" fill="#0f766e" text-anchor="middle">α²</text>
  <rect x="358" y="878" width="74" height="74" fill="#5eead4"/><text x="395" y="908" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">0.5</text><text x="395" y="930" font-size="10" fill="#0f766e" text-anchor="middle">α¹</text>
  <rect x="432" y="878" width="74" height="74" fill="#14b8a6"/><text x="469" y="908" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="469" y="930" font-size="10" fill="#ccfbf1" text-anchor="middle">α⁰</text>

  <text x="530" y="689" font-size="12" fill="#374151">验算格 (i=4, j=1):</text>
  <text x="530" y="709" font-size="12" fill="#374151">γ⁴ ÷ γ¹ = 0.0625 ÷ 0.5</text>
  <text x="530" y="729" font-size="12" font-weight="bold" fill="#16a34a">= 0.125 = α³ ✓</text>
  <text x="530" y="781" font-size="12" fill="#374151">对角线恒为 1(含对角);</text>
  <text x="530" y="801" font-size="12" fill="#374151">α 为常量时即 αⁱ⁻ʲ</text>
  <text x="530" y="853" font-size="12" fill="#374151">γⁱ 由前缀连乘得到;</text>
  <text x="530" y="873" font-size="12" fill="#374151">α 逐 token 不同时公式原样成立</text>

  <text x="60" y="992" font-size="11.5" fill="#6b7280">(4,1) 这类记法 = 第 i 行第 j 列;整张表没有一处幂运算 —— 每格只是一次除法。</text>

  <!-- ======== 底部用法 ======== -->
  <text x="40" y="1034" font-size="13" font-weight="bold" fill="#111827">用法:块内得分 (QKᵀ)⊙tril 的每格再乘对应 Γ 格 → 远处 key 的贡献按 αⁱ⁻ʲ 缩水 —— §6 的「距离加权因果掩码」在此落地。</text>
</svg>
