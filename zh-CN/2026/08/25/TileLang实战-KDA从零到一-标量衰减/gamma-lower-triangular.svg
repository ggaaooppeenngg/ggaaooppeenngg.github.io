<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1360" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="800" height="1360" fill="#ffffff"/>

  <!-- ======== 标题与公式 ======== -->
  <text x="40" y="42" font-size="19" font-weight="bold" fill="#111827">GDN 块内衰减矩阵 Γ:下三角、按「年龄」加权</text>
  <rect x="40" y="58" width="720" height="66" rx="8" fill="#fafafa" stroke="#d1d5db"/>
  <text x="58" y="84" font-size="14" fill="#111827">Γ[i,j] = γⁱ ÷ γʲ ,其中 γⁱ = α₁α₂⋯αᵢ(chunk 内前 i 个门的累积积,下标 [t] 省略)</text>
  <text x="58" y="110" font-size="14" font-weight="bold" fill="#111827">= αⁱ⁻ʲ  若 j ≤ i(过去)      = 0  若 j &gt; i(未来)</text>

  <!-- ======== 面板 ①:结构 ======== -->
  <rect x="30" y="150" width="730" height="430" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="50" y="182" font-size="17" font-weight="bold" fill="#0f766e">① 结构:C×C 下三角,取值只看「年龄」i−j</text>

  <text x="141" y="216" font-size="11" fill="#6b7280" text-anchor="middle">j=1</text>
  <text x="203" y="216" font-size="11" fill="#6b7280" text-anchor="middle">j=2</text>
  <text x="265" y="216" font-size="11" fill="#6b7280" text-anchor="middle">j=3</text>
  <text x="327" y="216" font-size="11" fill="#6b7280" text-anchor="middle">j=4</text>
  <text x="389" y="216" font-size="11" fill="#6b7280" text-anchor="middle">j=5</text>
  <text x="100" y="260" font-size="11" fill="#6b7280" text-anchor="end">i=1</text>
  <text x="100" y="322" font-size="11" fill="#6b7280" text-anchor="end">i=2</text>
  <text x="100" y="384" font-size="11" fill="#6b7280" text-anchor="end">i=3</text>
  <text x="100" y="446" font-size="11" fill="#6b7280" text-anchor="end">i=4</text>
  <text x="100" y="508" font-size="11" fill="#6b7280" text-anchor="end">i=5</text>

  <!-- 行1 -->
  <rect x="110" y="225" width="62" height="62" fill="#14b8a6"/><text x="141" y="262" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">α⁰</text>
  <rect x="172" y="225" width="62" height="62" fill="#f3f4f6"/><text x="203" y="262" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="234" y="225" width="62" height="62" fill="#f3f4f6"/><text x="265" y="262" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="296" y="225" width="62" height="62" fill="#f3f4f6"/><text x="327" y="262" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="358" y="225" width="62" height="62" fill="#f3f4f6"/><text x="389" y="262" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <!-- 行2 -->
  <rect x="110" y="287" width="62" height="62" fill="#5eead4"/><text x="141" y="324" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α¹</text>
  <rect x="172" y="287" width="62" height="62" fill="#14b8a6"/><text x="203" y="324" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">α⁰</text>
  <rect x="234" y="287" width="62" height="62" fill="#f3f4f6"/><text x="265" y="324" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="296" y="287" width="62" height="62" fill="#f3f4f6"/><text x="327" y="324" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="358" y="287" width="62" height="62" fill="#f3f4f6"/><text x="389" y="324" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <!-- 行3 -->
  <rect x="110" y="349" width="62" height="62" fill="#99f6e4"/><text x="141" y="386" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α²</text>
  <rect x="172" y="349" width="62" height="62" fill="#5eead4"/><text x="203" y="386" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α¹</text>
  <rect x="234" y="349" width="62" height="62" fill="#14b8a6"/><text x="265" y="386" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">α⁰</text>
  <rect x="296" y="349" width="62" height="62" fill="#f3f4f6"/><text x="327" y="386" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="358" y="349" width="62" height="62" fill="#f3f4f6"/><text x="389" y="386" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <!-- 行4 -->
  <rect x="110" y="411" width="62" height="62" fill="#ccfbf1"/><text x="141" y="448" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α³</text>
  <rect x="172" y="411" width="62" height="62" fill="#99f6e4"/><text x="203" y="448" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α²</text>
  <rect x="234" y="411" width="62" height="62" fill="#5eead4"/><text x="265" y="448" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α¹</text>
  <rect x="296" y="411" width="62" height="62" fill="#14b8a6"/><text x="327" y="448" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">α⁰</text>
  <rect x="358" y="411" width="62" height="62" fill="#f3f4f6"/><text x="389" y="448" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <!-- 行5 -->
  <rect x="110" y="473" width="62" height="62" fill="#d5f3ec"/><text x="141" y="510" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α⁴</text>
  <rect x="172" y="473" width="62" height="62" fill="#ccfbf1"/><text x="203" y="510" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α³</text>
  <rect x="234" y="473" width="62" height="62" fill="#99f6e4"/><text x="265" y="510" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α²</text>
  <rect x="296" y="473" width="62" height="62" fill="#5eead4"/><text x="327" y="510" font-size="15" font-weight="bold" fill="#134e4a" text-anchor="middle">α¹</text>
  <rect x="358" y="473" width="62" height="62" fill="#14b8a6"/><text x="389" y="510" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">α⁰</text>

  <rect x="450" y="234" width="16" height="16" fill="#14b8a6"/>
  <text x="474" y="247" font-size="12" fill="#134e4a">对角线 α⁰ = 1:自己看自己,0 步衰减</text>
  <text x="474" y="265" font-size="11" fill="#6b7280">(含对角 —— 与系列 inclusive 约定一致)</text>
  <rect x="450" y="314" width="16" height="16" fill="#99f6e4"/>
  <text x="474" y="327" font-size="12" fill="#134e4a">同一行自右向左:年龄 i−j 增大,</text>
  <text x="474" y="345" font-size="12" fill="#134e4a">权重按 α^年龄 指数缩水</text>
  <rect x="450" y="404" width="16" height="16" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="474" y="417" font-size="12" fill="#374151">上三角 j&gt;i = 未来:整块置 0</text>
  <text x="474" y="435" font-size="11" fill="#6b7280">「下三角」的全部含义就在这</text>
  <text x="50" y="566" font-size="11.5" fill="#6b7280">图中 C = 5;实际块长 C = 64 或 128,结构完全相同。颜色越深 = 衰减越少 = 距离越近。</text>

  <!-- ======== 面板 ②:数值例 ======== -->
  <rect x="30" y="600" width="730" height="430" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="50" y="632" font-size="17" font-weight="bold" fill="#111827">② 数值例:α = 0.5,C = 4 —— 每格 = 行标 γⁱ ÷ 列标 γʲ</text>

  <text x="358" y="660" font-size="11" fill="#6b7280" text-anchor="middle">列标 γʲ(除数)</text>
  <text x="247" y="680" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">0.5</text>
  <text x="321" y="680" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">0.25</text>
  <text x="395" y="680" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">0.125</text>
  <text x="469" y="680" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="middle">0.0625</text>
  <text x="140" y="680" font-size="11" fill="#6b7280" text-anchor="middle">行标 γⁱ ↓</text>
  <text x="200" y="731" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="end">0.5</text>
  <text x="200" y="805" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="end">0.25</text>
  <text x="200" y="879" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="end">0.125</text>
  <text x="200" y="953" font-size="12" font-weight="bold" fill="#0f766e" text-anchor="end">0.0625</text>

  <!-- 行1 -->
  <rect x="210" y="690" width="74" height="74" fill="#14b8a6"/><text x="247" y="722" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="247" y="742" font-size="10" fill="#ccfbf1" text-anchor="middle">α⁰</text>
  <rect x="284" y="690" width="74" height="74" fill="#f3f4f6"/><text x="321" y="732" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="358" y="690" width="74" height="74" fill="#f3f4f6"/><text x="395" y="732" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="432" y="690" width="74" height="74" fill="#f3f4f6"/><text x="469" y="732" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <!-- 行2 -->
  <rect x="210" y="764" width="74" height="74" fill="#5eead4"/><text x="247" y="796" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">0.5</text><text x="247" y="816" font-size="10" fill="#0f766e" text-anchor="middle">α¹</text>
  <rect x="284" y="764" width="74" height="74" fill="#14b8a6"/><text x="321" y="796" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="321" y="816" font-size="10" fill="#ccfbf1" text-anchor="middle">α⁰</text>
  <rect x="358" y="764" width="74" height="74" fill="#f3f4f6"/><text x="395" y="806" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <rect x="432" y="764" width="74" height="74" fill="#f3f4f6"/><text x="469" y="806" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <!-- 行3 -->
  <rect x="210" y="838" width="74" height="74" fill="#99f6e4"/><text x="247" y="870" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">0.25</text><text x="247" y="890" font-size="10" fill="#0f766e" text-anchor="middle">α²</text>
  <rect x="284" y="838" width="74" height="74" fill="#5eead4"/><text x="321" y="870" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">0.5</text><text x="321" y="890" font-size="10" fill="#0f766e" text-anchor="middle">α¹</text>
  <rect x="358" y="838" width="74" height="74" fill="#14b8a6"/><text x="395" y="870" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="395" y="890" font-size="10" fill="#ccfbf1" text-anchor="middle">α⁰</text>
  <rect x="432" y="838" width="74" height="74" fill="#f3f4f6"/><text x="469" y="880" font-size="13" fill="#9ca3af" text-anchor="middle">0</text>
  <!-- 行4 -->
  <rect x="210" y="912" width="74" height="74" fill="#ccfbf1"/><text x="247" y="944" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">0.125</text><text x="247" y="964" font-size="10" fill="#0f766e" text-anchor="middle">α³</text>
  <rect x="284" y="912" width="74" height="74" fill="#99f6e4"/><text x="321" y="944" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">0.25</text><text x="321" y="964" font-size="10" fill="#0f766e" text-anchor="middle">α²</text>
  <rect x="358" y="912" width="74" height="74" fill="#5eead4"/><text x="395" y="944" font-size="16" font-weight="bold" fill="#134e4a" text-anchor="middle">0.5</text><text x="395" y="964" font-size="10" fill="#0f766e" text-anchor="middle">α¹</text>
  <rect x="432" y="912" width="74" height="74" fill="#14b8a6"/><text x="469" y="944" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="469" y="964" font-size="10" fill="#ccfbf1" text-anchor="middle">α⁰</text>

  <text x="540" y="712" font-size="12" fill="#374151">验算格 (4,1):</text>
  <text x="540" y="732" font-size="12" fill="#374151">γ⁴ ÷ γ¹ = 0.0625 ÷ 0.5</text>
  <text x="540" y="752" font-size="12" font-weight="bold" fill="#16a34a">= 0.125 = α³ ✓</text>
  <text x="540" y="800" font-size="12" fill="#374151">γ 全表只需 C−1 = 3 次乘法:</text>
  <text x="540" y="820" font-size="12" fill="#374151">γ = (0.5, 0.25, 0.125, 0.0625)</text>
  <text x="540" y="840" font-size="12" fill="#374151">之后每格只是一次除法</text>
  <text x="540" y="900" font-size="12" fill="#374151">对角恒为 1(含对角);</text>
  <text x="540" y="920" font-size="12" fill="#374151">常量 α 时 γⁱ = αⁱ,</text>
  <text x="540" y="940" font-size="12" fill="#374151">比值 = αⁱ ÷ αʲ = αⁱ⁻ʲ ✓</text>
  <text x="60" y="1014" font-size="11.5" fill="#6b7280">逐 token 时:Γ[i,j] = αⱼ₊₁⋯αᵢ —— 从 j 走到 i 沿路每个门各衰一次,「行标÷列标」公式原样成立。</text>

  <!-- ======== 面板 ③:为什么写成比值 ======== -->
  <rect x="30" y="1050" width="730" height="230" rx="14" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.5"/>
  <text x="50" y="1082" font-size="17" font-weight="bold" fill="#111827">③ 为什么论文把它写成比值 γⁱ/γʲ</text>

  <rect x="50" y="1100" width="345" height="140" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="66" y="1126" font-size="13" font-weight="bold" fill="#111827">幂形式 vs 比值形式</text>
  <text x="66" y="1150" font-size="12" fill="#374151">αⁱ⁻ʲ 逐格算幂:C² 次幂运算</text>
  <text x="66" y="1172" font-size="12" fill="#374151">γⁱ/γʲ:C−1 次乘法得全部 γⁱ,每格一次除法</text>
  <text x="66" y="1198" font-size="12" font-weight="bold" fill="#b45309">α 逐 token 不同时,αⁱ⁻ʲ 连唯一底数都没有</text>
  <text x="66" y="1220" font-size="12" font-weight="bold" fill="#b45309">比值形式是唯一通用写法 —— 论文的真正原因</text>

  <rect x="415" y="1100" width="325" height="140" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="431" y="1126" font-size="13" font-weight="bold" fill="#111827">log 空间视角(→ L3 的入口)</text>
  <text x="431" y="1150" font-size="12" fill="#374151">log Γ[i,j] = bᵢ − bⱼ ,b = cumsum(log α)</text>
  <text x="431" y="1172" font-size="12" fill="#374151">每格 = 一次减法 + exp,永不连乘下溢</text>
  <text x="431" y="1194" font-size="12" fill="#374151">α 逐通道时是唯一安全通道;</text>
  <text x="431" y="1216" font-size="12" fill="#374151">即 fla chunk_fwd.py 里 g 先过 cumsum(RCP_LN2)</text>

  <text x="50" y="1266" font-size="13" font-weight="bold" fill="#111827">用法:块内得分 A_c = (QKᵀ)⊙tril 的每格再乘 Γ 对应格 → 远处 key 的贡献按 α^年龄 缩水 —— §6 预告的「距离加权因果掩码」在此落地。</text>
</svg>
