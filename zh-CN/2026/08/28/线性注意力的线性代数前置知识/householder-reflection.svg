<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" font-family="'Times New Roman', 'STIX Two Text', serif">
  <title>Householder 反射的几何:Hx 是 x 关于过原点、法向 u 的超平面的镜像</title>
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#1a1a1a" stroke-width="1.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111"/>
    </marker>
    <marker id="arrowgray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="650" fill="#ffffff"/>

  <!-- 超平面(n=2 退化为直线) -->
  <line x1="593.4" y1="267.6" x2="6.6" y2="392.4" stroke="#111" stroke-width="1.4" stroke-dasharray="9 6"/>
  <text x="16" y="418" font-family="SimSun, Songti SC, Noto Serif CJK SC, serif" font-size="14" fill="#333">超平面 <tspan font-family="'Times New Roman',serif" font-style="italic">u</tspan><tspan font-family="'Times New Roman',serif" dy="-6" font-size="11">⊤</tspan><tspan font-family="'Times New Roman',serif" dy="6" font-style="italic">x</tspan><tspan font-family="'Times New Roman',serif"> = 0</tspan></text>
  <text x="16" y="440" font-family="SimSun, Songti SC, Noto Serif CJK SC, serif" font-size="13" fill="#666">(<tspan font-family="'Times New Roman',serif" font-style="italic">n</tspan> = 2 时退化为直线)</text>

  <!-- u 所在法向轴(延长虚线) -->
  <line x1="248.0" y1="85.5" x2="341.6" y2="525.6" stroke="#999" stroke-width="0.8" stroke-dasharray="3 5"/>

  <!-- 原点处直角标记(u ⊥ 超平面) -->
  <path d="M295.8,310.4 L315.4,306.3 L319.6,325.8" fill="none" stroke="#111" stroke-width="1"/>

  <!-- 平行四边形辅助线:x = x_par + x_perp,Hx = x_perp − x_par -->
  <line x1="272.6" y1="201.1" x2="426.2" y2="168.5" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="453.6" y1="297.3" x2="426.2" y2="168.5" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="327.4" y1="458.9" x2="481.0" y2="426.2" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="453.6" y1="297.3" x2="481.0" y2="426.2" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 镜像连线:x 与 Hx 关于超平面等距对称 -->
  <line x1="426.2" y1="168.5" x2="481.0" y2="426.2" stroke="#1a1a1a" stroke-width="0.9" stroke-dasharray="2 5"/>
  <path d="M450.7,283.7 L437.0,286.6 L439.9,300.3" fill="none" stroke="#111" stroke-width="0.9"/>
  <line x1="433.1" y1="234.4" x2="446.8" y2="231.4" stroke="#111" stroke-width="1.2"/>
  <line x1="460.5" y1="363.3" x2="474.2" y2="360.3" stroke="#111" stroke-width="1.2"/>

  <!-- 平面内分量 x_perp(灰) -->
  <line x1="300.0" y1="330.0" x2="453.6" y2="297.3" stroke="#555" stroke-width="1.8" marker-end="url(#arrowgray)"/>
  <!-- 翻转后的法向分量 −x_par(灰,与 u 反向,不与 u 重叠) -->
  <line x1="300.0" y1="330.0" x2="327.4" y2="458.9" stroke="#555" stroke-width="1.8" marker-end="url(#arrowgray)"/>

  <!-- 法向单位向量 u(黑,长度短于 x_par,末端留出投影点) -->
  <line x1="300.0" y1="330.0" x2="276.7" y2="220.4" stroke="#111" stroke-width="2.6" marker-end="url(#arrow)"/>
  <!-- 投影点 x_par(不画箭头,避免与 u 共线重叠) -->
  <circle cx="272.6" cy="201.1" r="3.6" fill="#111"/>

  <!-- x 与 Hx -->
  <line x1="300.0" y1="330.0" x2="426.2" y2="168.5" stroke="#111" stroke-width="2.6" marker-end="url(#arrow)"/>
  <line x1="300.0" y1="330.0" x2="481.0" y2="426.2" stroke="#111" stroke-width="2.6" marker-end="url(#arrow)"/>

  <circle cx="300.0" cy="330.0" r="3.6" fill="#111"/>
  <text x="278.0" y="352.0" font-size="15" font-style="italic" fill="#111">O</text>

  <!-- 标注 -->
  <text x="436.2" y="164.5" font-size="21" font-style="italic" fill="#111">x</text>
  <text x="493.0" y="444.2" font-size="21" fill="#111"><tspan font-style="italic">H</tspan><tspan font-style="italic">x</tspan></text>
  <text x="244.7" y="242.4" font-size="21" font-style="italic" fill="#111">u</text>
  <text x="281.6" y="197.1" font-size="17" fill="#333"><tspan font-style="italic">x</tspan><tspan dy="6" font-size="13">∥</tspan></text>
  <text x="271.4" y="462.9" font-size="17" fill="#333"><tspan>−</tspan><tspan font-style="italic">x</tspan><tspan dy="6" font-size="13">∥</tspan></text>
  <text x="461.6" y="323.3" font-size="17" fill="#333"><tspan font-style="italic">x</tspan><tspan dy="6" font-size="13">⊥</tspan></text>

  <!-- 公式区 -->
  <rect x="470" y="52" width="264" height="112" fill="url(#hatch)" opacity="0.12"/>
  <rect x="470" y="52" width="264" height="112" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="486" y="80" font-size="17" fill="#111"><tspan font-style="italic">x</tspan><tspan> = </tspan><tspan font-style="italic">x</tspan><tspan dy="5" font-size="13">∥</tspan><tspan dy="-5"> + </tspan><tspan font-style="italic">x</tspan><tspan dy="5" font-size="13">⊥</tspan></text>
  <text x="486" y="110" font-size="17" fill="#111"><tspan font-style="italic">H</tspan><tspan font-style="italic">x</tspan><tspan dy="5" font-size="13">∥</tspan><tspan dy="-5"> = −</tspan><tspan font-style="italic">x</tspan><tspan dy="5" font-size="13">∥</tspan><tspan dy="-5" font-family="SimSun, Songti SC, Noto Serif CJK SC, serif" font-size="13" fill="#444">  (法向翻转)</tspan></text>
  <text x="486" y="140" font-size="17" fill="#111"><tspan font-style="italic">H</tspan><tspan font-style="italic">x</tspan><tspan dy="5" font-size="13">⊥</tspan><tspan dy="-5"> = </tspan><tspan font-style="italic">x</tspan><tspan dy="5" font-size="13">⊥</tspan><tspan dy="-5" font-family="SimSun, Songti SC, Noto Serif CJK SC, serif" font-size="13" fill="#444">  (平面内不动)</tspan></text>

  <!-- 底部结论 -->
  <text x="380.0" y="594" text-anchor="middle" font-size="21" fill="#111"><tspan font-style="italic">H</tspan><tspan font-style="italic">x</tspan><tspan> = </tspan><tspan font-style="italic">x</tspan><tspan dy="5" font-size="14">⊥</tspan><tspan dy="-5"> − </tspan><tspan font-style="italic">x</tspan><tspan dy="5" font-size="14">∥</tspan><tspan dy="-5">,  ‖</tspan><tspan font-style="italic">H</tspan><tspan font-style="italic">x</tspan><tspan>‖ = ‖</tspan><tspan font-style="italic">x</tspan><tspan>‖,  det </tspan><tspan font-style="italic">H</tspan><tspan> = −1</tspan></text>
  <text x="380.0" y="624" text-anchor="middle" font-family="SimSun, Songti SC, Noto Serif CJK SC, serif" font-size="14" fill="#555">反射保长度、翻转定向;特征值 −1 对应 <tspan font-family="'Times New Roman',serif" font-style="italic">u</tspan>,+1 的重数为 <tspan font-family="'Times New Roman',serif" font-style="italic">n</tspan> − 1</text>
</svg>
