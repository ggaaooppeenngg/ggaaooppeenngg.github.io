<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 500" font-family="'Times New Roman', 'STIX Two Text', serif">
 <title>Householder 反射的几何:u = e1, x = [3,2]⊤</title>
  <defs>
    <pattern id="hatchA" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#c9c9c9" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 12 9" refX="10" refY="4.5" markerWidth="12" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 L3,4.5 z" fill="#111"/>
    </marker>
    <marker id="arrm" viewBox="0 0 12 9" refX="10" refY="4.5" markerWidth="11" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 L3,4.5 z" fill="#555"/>
    </marker>
    <marker id="arrg" viewBox="0 0 12 9" refX="10" refY="4.5" markerWidth="11" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,4.5 L0,9 L3,4.5 z" fill="#999"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1010" height="500" fill="#ffffff"/>

  <!-- ================= 几何 ================= -->
  <text x="60" y="72" font-family="SimSun, Songti SC, serif" font-size="16" fill="#111">几何:<tspan font-family="'Times New Roman', Times, serif" font-style="italic">u</tspan><tspan font-family="'Times New Roman', Times, serif"> = </tspan><tspan font-family="'Times New Roman', Times, serif" font-style="italic">e</tspan><tspan font-family="'Times New Roman', Times, serif" font-size="11" dy="4">1</tspan><tspan dy="-4" font-family="SimSun, Songti SC, serif"> 时,镜像恰为 </tspan><tspan font-family="'Times New Roman', Times, serif" font-style="italic">x</tspan><tspan font-family="'Times New Roman', Times, serif" font-size="11" dy="4">2</tspan><tspan dy="-4" font-family="SimSun, Songti SC, serif"> 轴</tspan></text>

  <!-- 坐标轴 -->
  <line x1="70" y1="385" x2="930" y2="385" stroke="#444" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="480" y1="480" x2="480" y2="95" stroke="#444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="908" y="412" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="16" fill="#444">x<tspan dy="4" font-size="11">1</tspan></text>
  <text x="492" y="114" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="16" fill="#444">x<tspan dy="4" font-size="11">2</tspan></text>

  <!-- 镜像带(沿 x2 轴) -->
  <rect x="470" y="105" width="20" height="360" fill="url(#hatchA)" stroke="none"/>
  <text x="497" y="142" font-family="SimSun, Songti SC, serif" font-size="13.5" fill="#444">镜像超平面:<tspan font-family="'Times New Roman', Times, serif" font-style="italic">x</tspan><tspan font-family="'Times New Roman', Times, serif" font-size="10" dy="3.5">1</tspan><tspan dy="-3.5" font-family="SimSun, Songti SC, serif"> = 0(</tspan><tspan font-family="'Times New Roman', Times, serif" font-style="italic">u</tspan><tspan font-family="'Times New Roman', Times, serif"> ⊥ 镜像)</tspan></text>
  <text x="95" y="135" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="16" fill="#111">‖u‖<tspan dy="4" font-size="11" font-style="normal">2</tspan><tspan dy="-4" font-size="16"> = 1</tspan></text>

  <!-- 虚线连接:x' <- F -> x -->
  <line x1="480" y1="285" x2="348" y2="285" stroke="#555" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrm)"/>
  <line x1="612" y1="285" x2="490" y2="285" stroke="#555" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrm)"/>

  <!-- 向量 x' 与 x -->
  <line x1="480" y1="385" x2="330" y2="285" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="480" y1="385" x2="630" y2="285" stroke="#111" stroke-width="2.2" marker-end="url(#arr)"/>
  <!-- 单位向量 u(沿 x1 轴) -->
  <line x1="480" y1="385" x2="530" y2="385" stroke="#111" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 垂足直角符号与等距刻度 -->
  <polyline points="480,277 488,277 488,285" fill="none" stroke="#555" stroke-width="1.2"/>

  <!-- 两段 −(u^T x)u 范围标注 -->
  <path d="M 492,275 L 492,270 L 549,270 L 553,265 L 557,270 L 614,270 L 614,275" fill="none" stroke="#555" stroke-width="1.1"/>
  <text x="553" y="259" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="13.5" fill="#444">−(u<tspan dy="-5" font-size="9.5" font-style="normal">⊤</tspan><tspan dy="5" font-size="13.5">x)u</tspan></text>
  <path d="M 346,275 L 346,270 L 403,270 L 407,265 L 411,270 L 468,270 L 468,275" fill="none" stroke="#555" stroke-width="1.1"/>
  <text x="407" y="259" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="13.5" fill="#444">−(u<tspan dy="-5" font-size="9.5" font-style="normal">⊤</tspan><tspan dy="5" font-size="13.5">x)u</tspan></text>
  <text x="90" y="458" font-family="SimSun, Songti SC, serif" font-size="13.5" fill="#666">从 <tspan font-family="'Times New Roman', Times, serif" font-style="italic">x</tspan><tspan font-family="SimSun, Songti SC, serif"> 出发:走一步 −(</tspan><tspan font-family="'Times New Roman', Times, serif" font-style="italic">u</tspan><tspan font-family="'Times New Roman', Times, serif" font-size="9.5" dy="-5" font-style="normal">⊤</tspan><tspan dy="5" font-size="13.5" font-family="'Times New Roman', Times, serif" font-style="italic">x</tspan><tspan font-family="SimSun, Songti SC, serif">)u 到镜面,再走一步 −(</tspan><tspan font-family="'Times New Roman', Times, serif" font-style="italic">u</tspan><tspan font-family="'Times New Roman', Times, serif" font-size="9.5" dy="-5" font-style="normal">⊤</tspan><tspan dy="5" font-size="13.5" font-family="'Times New Roman', Times, serif" font-style="italic">x</tspan><tspan font-family="SimSun, Songti SC, serif">)u 到 </tspan><tspan font-family="'Times New Roman', Times, serif" font-style="italic">x</tspan><tspan font-family="'Times New Roman', Times, serif">′</tspan></text>
  <line x1="410" y1="290" x2="418" y2="280" stroke="#888" stroke-width="1.3"/>
  <line x1="542" y1="290" x2="550" y2="280" stroke="#888" stroke-width="1.3"/>

  <circle cx="480" cy="385" r="2.6" fill="#111"/>

  <!-- 向量标注 -->
  <text x="642" y="272" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="17" fill="#111">x<tspan> = [3, 2]</tspan><tspan dy="-6" font-size="11" font-style="normal">⊤</tspan></text>
  <text x="318" y="270" text-anchor="end" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="17" fill="#111">x′<tspan> = [−3, 2]</tspan><tspan dy="-6" font-size="11" font-style="normal">⊤</tspan></text>
  <text x="545" y="410" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="16" fill="#111">u<tspan> = </tspan><tspan font-style="italic">e</tspan><tspan dy="4" font-size="11">1</tspan><tspan dy="-4" font-size="16"> = [1, 0]</tspan><tspan dy="-6" font-size="11" font-style="normal">⊤</tspan></text>
  <text x="463" y="404" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="14" fill="#555">O</text>

</svg>